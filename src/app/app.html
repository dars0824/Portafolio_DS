<div class="app-shell">
  <div class="app-shell__backdrop" aria-hidden="true">
    <div class="app-shell__grid"></div>
    <div class="app-shell__aurora app-shell__aurora--a"></div>
    <div class="app-shell__aurora app-shell__aurora--b"></div>
    <div class="app-shell__noise"></div>
  </div>

  @if (!introDone()) {
  <app-anprinci (finished)="completeIntro()"></app-anprinci>
  } @else {
  <div class="app-content">
    <app-menu></app-menu>
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>

    <button
      type="button"
      class="app-scroll-top"
      (click)="scrollToTop()"
      [style.opacity]="scrollButtonOpacity()"
      [style.pointer-events]="scrollButtonOpacity() > 0 ? 'auto' : 'none'"
      aria-label="Subir al inicio">
      Subir
    </button>
  </div>
  }
</div>
