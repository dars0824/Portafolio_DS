<div class="content-block cyber">
  <header class="content-block__header">
    <p>Zona Ciberseguridad</p>
    <h2>Simulación de terminal defensiva en vivo</h2>
  </header>

  <div class="cyber__terminal" role="status" aria-live="polite">
    @for (line of renderedLog(); track line) {
    <p>{{ line }}</p>
    }
    <span class="cyber__cursor"></span>
  </div>

  <p class="cyber__status">Estado: {{ status() }}</p>
</div>
