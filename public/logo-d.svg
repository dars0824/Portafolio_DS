<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Letra D centrada con gradiente -->
  <text x="100" y="145" font-size="160" font-weight="900" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="url(#dGradient)" filter="url(#glow)">D</text>
  
  <!-- Brillo sutil alrededor -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#dGradient)" stroke-width="0.5" opacity="0.3"/>
</svg>